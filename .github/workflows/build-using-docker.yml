name: Build and test app in Docker container

on:
  pull_request:
  push:

jobs:
  build-and-test-in-docker:
    runs-on: ubuntu-24.04
    container:
      # CI image from https://github.com/siddhantmodi/zephyrrtos-docker
      # Keep the Zephyr SDK version in sync with .devcontainer/devcontainer.json
      image: ghcr.io/siddhantmodi/zephyr-ci:zsdk_v1.0.1
      # The image defaults to 'user', but GitHub Actions needs root to write to the mounted workspace
      options: --user root
    steps:
      - name: Checkout repository with example application
        uses: actions/checkout@v7
        with:
          path: example-application

      - name: Prepare west project
        run: ./example-application/west_setup.sh

      - name: Build firmware
        working-directory: example-application
        run: |
          west twister -T app -v --inline-logs --integration

      - name: Store hex files
        uses: actions/upload-artifact@v7
        with:
          name: built-applications
          path: example-application/twister-out/**/zephyr/zephyr.hex

      - name: Twister Tests
        working-directory: example-application
        run: |
          west twister -T tests -v --inline-logs --integration
